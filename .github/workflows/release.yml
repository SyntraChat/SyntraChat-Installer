name: Release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      client: ${{ steps.release.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        env:
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path('release.json').read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+', data['version'])
          assert re.fullmatch(r'[0-9a-f]{40}', data['client_revision'])
          if os.environ['REF'].startswith('refs/tags/'):
              assert os.environ['REF'] == 'refs/tags/v' + data['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + data['version'] + '\nclient=' + data['client_revision'] + '\n')
          PY
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n install.sh && sh -n install-gui.sh
      - run: shellcheck install.sh install-gui.sh
  build:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            bundles: deb,rpm,appimage
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            bundles: app,dmg
          - os: macos-26
            platform: macos
            arch: aarch64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      BUNDLES: ${{ matrix.bundles }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      APPLE_SIGNING_IDENTITY: '-'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SyntraChat/SyntraChat
          ref: ${{ needs.prepare.outputs.client }}
          path: client
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm libarchive-tools zstd xvfb dbus-x11
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: 'true'
          workspaces: |
            . -> target
            client/src-tauri -> target
      - name: Check matching versions
        run: |
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          v = os.environ['VERSION']
          assert json.loads(Path('client/package.json').read_text())['version'] == v
          for file in ['Cargo.toml', 'client/src-tauri/Cargo.toml']:
              assert tomllib.loads(Path(file).read_text())['package']['version'] == v
          PY
      - run: npm ci
        working-directory: client
      - name: Embed distribution license notices
        run: |
          cp client/LICENSE client/public/LICENSE.txt
          cp client/THIRD_PARTY_NOTICES.md client/public/THIRD_PARTY_NOTICES.txt
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
        working-directory: client
      - run: cargo +stable test --locked && cargo +stable clippy --locked --all-targets -- -D warnings
      - run: npm run build
        working-directory: client
      - run: cargo +stable test --locked && cargo +stable clippy --locked --all-targets -- -D warnings
        working-directory: client/src-tauri
      - name: Build native packages
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles "$BUNDLES"
        working-directory: client
      - run: cargo +stable build --locked --release
      - name: Collect packages
        run: |
          python scripts/package.py --version "$VERSION" --platform "$PLATFORM" --arch "$ARCH"
          suffix=''; test "$PLATFORM" != windows || suffix='.exe'
          cp "target/release/syntrachat-installer$suffix" "release-assets/syntrachat-verifier-$PLATFORM-$ARCH$suffix"
      - name: Windows silent install smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/install.Tests.ps1
          $setup = Get-ChildItem release-assets/*-setup.exe
          $process = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup exit: $($process.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'SyntraChat/syntrachat.exe'
          if (-not (Test-Path $installed)) { throw "Missing installed executable: $installed" }
      - name: macOS package and signature checks
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict client/src-tauri/target/release/bundle/macos/SyntraChat.app
          pkgutil --payload-files release-assets/*.pkg | grep 'Contents/MacOS/syntrachat'
          hdiutil verify release-assets/*.dmg
      - name: Linux package metadata and launch check
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info release-assets/*.deb
          rpm -qip release-assets/*.rpm
          bsdtar -xOf release-assets/*.pkg.tar.zst .PKGINFO | grep 'pkgname = syntrachat'
          chmod +x release-assets/*.AppImage
          set +e
          timeout 15s xvfb-run -a dbus-run-session -- client/src-tauri/target/release/syntrachat > launch.log 2>&1
          result=$?
          cat launch.log
          test "$result" -eq 124
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: flatpak-input
          path: flatpak-input/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  flatpak:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh run download "$GITHUB_RUN_ID" --name flatpak-input --dir flatpak-input
      - name: Install current builder and SDKs system-wide
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive flathub org.flatpak.Builder org.gnome.Platform//51 org.gnome.Sdk//51
          flatpak info --system org.gnome.Sdk//51
      - name: Build and verify Flatpak
        run: |
          mkdir -p release-assets
          flatpak run org.flatpak.Builder --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak.json
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo "release-assets/SyntraChat-$VERSION-linux-x86_64.flatpak" org.syntrachat.desktop
          flatpak install --user --noninteractive "release-assets/SyntraChat-$VERSION-linux-x86_64.flatpak"
          flatpak info --user org.syntrachat.desktop
          flatpak run --command=sh org.syntrachat.desktop -c 'ldd /app/bin/syntrachat' | tee flatpak-libraries.log
          ! grep -F 'not found' flatpak-libraries.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CLIENT_REVISION: ${{ needs.prepare.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every successful build
        run: |
          mkdir -p release-assets
          gh run download "$GITHUB_RUN_ID" --pattern 'release-*' --dir downloads
          find downloads -type f -exec cp '{}' release-assets/ \;
      - name: Assemble and verify complete release
        run: |
          cp install.ps1 install.sh release-assets/
          cp LICENSE release-assets/INSTALLER-LICENSE.txt
          tar -czf "release-assets/SyntraChat-$VERSION-linux-gui-installer.tar.gz" install.sh install-gui.sh README.md
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('release-assets/provenance.json').write_text(json.dumps({
            'version': os.environ['VERSION'], 'client_revision': os.environ['CLIENT_REVISION'],
            'installer_revision': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID']
          }, indent=2) + '\n')
          PY
          python3 scripts/check_release.py
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Publish 0.1.0 preview after all package checks pass
        run: |
          # A failed run never creates a partial public release. Never overwrite an existing release.
          gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "SyntraChat $VERSION" --notes-file RELEASE_NOTES.md --prerelease
