[package]
name = "syntrachat-installer"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Signed release verification foundation for the SyntraChat installer"

[dependencies]
ed25519-dalek = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
semver = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
